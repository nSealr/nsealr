[package]
name = "nsealr-threshold"
version = "0.0.0"
edition = "2021"
rust-version = "1.95"
license = "MIT"
publish = false
description = "Bounded no_std FROST participant owner for reviewed Nostr events"

[dependencies]
nsealr-core = { path = "../nsealr-core" }
frost-secp256k1-tr = { git = "https://github.com/ZcashFoundation/frost", rev = "0966bd1529aa062ad3b621af99e277f976b1c0f0", default-features = false }
chacha20 = { version = "=0.10.2", default-features = false, features = ["rng", "zeroize"] }
rand_core = { version = "=0.10.1", default-features = false }
sha2 = { version = "=0.11.0", default-features = false, features = ["zeroize"] }
zeroize = { version = "=1.9.1", default-features = false, features = ["alloc"] }

[dev-dependencies]
nsealr-allocator = { path = "../nsealr-allocator" }
serde_json = "=1.0.151"
