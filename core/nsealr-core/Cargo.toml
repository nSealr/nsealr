[package]
name = "nsealr-core"
version = "0.0.0"
edition = "2021"
rust-version = "1.95"
description = "Portable no_std Nostr protocol, review, policy and session core for nSealr."
license = "MIT"
publish = false

[features]
# Default builds use `no_std`; the optional `std` facade supports host consumers.
default = []
std = []

[dependencies]
zeroize = { version = "=1.9.1", default-features = false }
sha2 = { version = "=0.11.0", default-features = false, features = ["zeroize"] }

k256 = { version = "=0.14.0", default-features = false, features = ["schnorr", "ecdh"] }
hmac = { version = "=0.13.0", default-features = false, features = ["zeroize"] }
pbkdf2 = { version = "=0.13.0", default-features = false, features = ["hmac", "zeroize"] }
unicode-normalization = { version = "=0.1.26", default-features = false }

base64ct = { version = "=1.8.3", default-features = false }
hkdf = { version = "=0.13.0", default-features = false }
chacha20 = { version = "=0.10.2", default-features = false, features = ["cipher", "zeroize"] }
cipher = { version = "=0.5.2", default-features = false, features = ["zeroize"] }

[dev-dependencies]
serde_json = "=1.0.151"
unicode-normalization = { version = "=0.1.26", default-features = false, features = ["alloc"] }
