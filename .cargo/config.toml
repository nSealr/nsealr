# Offline dependency sources, including the retained security patches.
# Keep the exact vendor bytes and checksums; cargo vendor alone would discard
# the patches described in core/nsealr-core/vendor-patches and
# core/nsealr-threshold/patches.
[source.crates-io]
replace-with = "vendored-sources"

[source.vendored-sources]
directory = "vendor"

[source."git+https://github.com/ZcashFoundation/frost?rev=0966bd1529aa062ad3b621af99e277f976b1c0f0"]
git = "https://github.com/ZcashFoundation/frost"
rev = "0966bd1529aa062ad3b621af99e277f976b1c0f0"
replace-with = "vendored-sources"
