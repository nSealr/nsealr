[platformio]
src_dir = src

[env:s3-io]
platform = espressif32@6.5.0
platform_packages =
    platformio/framework-arduinoespressif32@3.20014.231204
    espressif/toolchain-xtensa-esp32s3@8.4.0+2021r2-patch5
board = lilygo-t-display-s3
framework = arduino
lib_extra_dirs = ${sysenv.NSEALR_S3_VENDOR_DIR}/lib
lib_ldf_mode = chain
lib_ignore =
    GFX Library for Arduino
    arduino-nofrendo
    Adafruit MPR121
    DabbleESP32
    PCF8575 library
    PCA95x5
    lvgl
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -Wall
    -Wextra
monitor_speed = 115200
