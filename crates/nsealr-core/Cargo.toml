[package]
name = "nsealr-core"
version = "0.0.0"
edition = "2021"
rust-version = "1.95"
description = "no_std backbone crate for the nSealr firmware family (empty scaffold; logic ported in later tasks)."
license = "MIT"
publish = false

[features]
# Default build is `no_std` for the firmware targets. `std` is an opt-in facade
# for host/desktop consumers; it is exercised by the `std`-gated test so the flag
# is never inert (EXECUTION-ETHICS.md §C, zero inert surface).
default = []
std = []

[dependencies]
zeroize = { version = "=1.9.1", default-features = false }
sha2 = { version = "=0.11.0", default-features = false, features = ["zeroize"] }

k256 = { version = "=0.14.0", default-features = false, features = ["schnorr"] }

[dev-dependencies]
serde_json = "=1.0.151"
